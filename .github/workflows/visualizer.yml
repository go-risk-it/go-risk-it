name: Visualizer

on:
  push:
    branches: [ "main" ]
  merge_group:

jobs:
  update_diagram:
    name: Update the codebase structure diagram
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Update diagram
        uses: githubocto/repo-visualizer@a999615bdab757559bf94bda1fe6eef232765f85 # main
        with:
          excluded_paths: "component-test,docs,mocks,supabase"
          output_file: codebase-structure.svg
          should_push: false

      - name: Generate PR for updates
        uses: peter-evans/create-pull-request@c0f553fe549906ede9cf27b5156039d195d2ece0 # v8
        with:
          commit-message: 'ci: update repo-visualizer diagram'
          signoff: true
          branch: ci_update_diagram
          delete-branch: true
          title: 'ci: update repo-visualizer diagram'
          add-paths: |
            codebase-structure.svg
