name: Invariant tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  merge_group:

jobs:
  invariant:
    runs-on: ubuntu-latest
    env:
      # Default 200 games for CI (integration-level tests with real DB).
      # Set to 1000+ for extended fuzzing with -timeout 1800s.
      INVARIANT_GAME_COUNT: "200"
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
    - name: Set up Go
      uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
      with:
        go-version-file: 'go.mod'
    - name: Run invariant tests
      run: >-
        go test -tags invariant -v -timeout 300s
        ./internal/testing/invariant/
        -args -rapid.checks="${INVARIANT_GAME_COUNT}"
