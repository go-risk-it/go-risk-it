name: Go

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  merge_group:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
    - name: Set up Go
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
      with:
        go-version-file: 'go.mod'
    - name: Build
      run: go build -v ./...
    - name: Test
      run: go test -v ./...
    - name: Coverage
      continue-on-error: true
      run: |
        go test -coverprofile=coverage.out ./...
        go tool cover -func=coverage.out | tail -1
    - name: Upload coverage
      if: success() || failure()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: coverage
        path: coverage.out
        if-no-files-found: ignore
    - name: Extract coverage percentage
      if: github.ref == 'refs/heads/main'
      id: coverage
      run: |
        if [ -f coverage.out ]; then
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | sed 's/%//')
          echo "percentage=$COVERAGE" >> "$GITHUB_OUTPUT"
        fi
    - name: Update coverage badge
      if: github.ref == 'refs/heads/main' && steps.coverage.outputs.percentage != ''
      uses: schneegans/dynamic-badges-action@e9a478b16159b4d31420099ba146cdc50f134483 # v1.7.0
      with:
        auth: ${{ secrets.GIST_TOKEN }}
        gistID: c7a818e871018f2841c29b4a992c95aa
        filename: go-risk-it-coverage.json
        label: coverage
        message: ${{ steps.coverage.outputs.percentage }}%
        valColorRange: ${{ steps.coverage.outputs.percentage }}
        minColorRange: 0
        maxColorRange: 100

  security:
    runs-on: ubuntu-latest
    # Informational: reports vulns but doesn't block merging
    # (Go stdlib vulns can't be fixed until next Go minor release)
    continue-on-error: true
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
    - name: Set up Go
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
      with:
        go-version-file: 'go.mod'
    - name: Install govulncheck
      run: go install golang.org/x/vuln/cmd/govulncheck@latest
    - name: Run govulncheck
      run: govulncheck ./...
