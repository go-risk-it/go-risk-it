name: Go

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  merge_group:

env:
  D2_VERSION: "0.6.9"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
    - name: Set up Go
      uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
      with:
        go-version-file: 'go.mod'
    - name: Build
      run: go build -v ./...
    - name: Test
      run: go test -v ./...
    - name: Coverage
      run: |
        PACKAGES=$(go list ./... | grep -v /mocks/)
        go test -coverprofile=coverage.out $PACKAGES
        COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | sed 's/%//')
        echo "Total coverage (excluding mocks): ${COVERAGE}%"
        THRESHOLD=25
        if [ "$(echo "$COVERAGE < $THRESHOLD" | bc -l)" -eq 1 ]; then
          echo "::error::Coverage ${COVERAGE}% is below threshold ${THRESHOLD}%"
          exit 1
        fi
    - name: Upload coverage
      if: success() || failure()
      uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
      with:
        name: coverage
        path: coverage.out
        if-no-files-found: ignore
    - name: Update coverage badge
      if: github.ref == 'refs/heads/main'
      run: |
        if [ ! -f coverage.out ]; then exit 0; fi
        COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | sed 's/%//')

        # Pick color based on coverage
        if [ "$(echo "$COVERAGE >= 80" | bc -l)" -eq 1 ]; then COLOR="brightgreen"
        elif [ "$(echo "$COVERAGE >= 60" | bc -l)" -eq 1 ]; then COLOR="green"
        elif [ "$(echo "$COVERAGE >= 40" | bc -l)" -eq 1 ]; then COLOR="yellowgreen"
        elif [ "$(echo "$COVERAGE >= 20" | bc -l)" -eq 1 ]; then COLOR="orange"
        else COLOR="red"; fi

        JSON="{\"schemaVersion\":1,\"label\":\"coverage\",\"message\":\"${COVERAGE}%\",\"color\":\"${COLOR}\"}"

        # Push to badges branch
        cd "$(mktemp -d)"
        git init
        git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"

        git fetch origin badges 2>/dev/null && git checkout badges || git checkout --orphan badges

        mkdir -p badges
        echo "$JSON" > badges/coverage.json
        git add badges/coverage.json
        git diff --cached --quiet || git commit -m "Update coverage badge: ${COVERAGE}%"
        git push origin badges

  security:
    runs-on: ubuntu-latest
    # Informational: reports vulns but doesn't block merging
    # (Go stdlib vulns can't be fixed until next Go minor release)
    continue-on-error: true
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
    - name: Set up Go
      uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
      with:
        go-version-file: 'go.mod'
    - name: Install govulncheck
      run: go install golang.org/x/vuln/cmd/govulncheck@latest
    - name: Run govulncheck
      run: govulncheck ./...

  architecture:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
    - name: Set up Go
      uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
      with:
        go-version-file: 'go.mod'
    - name: Architecture rules
      run: go test -run TestArch -v -count=1 ./internal/
    - name: Install D2
      run: |
        curl -fsSL "https://github.com/terrastruct/d2/releases/download/v${D2_VERSION}/d2-v${D2_VERSION}-linux-amd64.tar.gz" -o /tmp/d2.tar.gz
        mkdir -p /tmp/d2-extract
        tar xzf /tmp/d2.tar.gz -C /tmp/d2-extract
        sudo cp /tmp/d2-extract/d2-v${D2_VERSION}/bin/d2 /usr/local/bin/d2
        rm -rf /tmp/d2.tar.gz /tmp/d2-extract
        d2 --version
    - name: Diagram freshness check
      run: make docs-check
    - name: Install go-jsonnet
      run: go install github.com/google/go-jsonnet/cmd/jsonnet@v0.22.0
    - name: Dashboard freshness check
      run: make dashboards-check
