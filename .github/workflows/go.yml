name: Go

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  merge_group:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
    - name: Set up Go
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
      with:
        go-version-file: 'go.mod'
    - name: Build
      run: go build -v ./...
    - name: Test
      run: go test -v ./...
    - name: Coverage
      run: |
        PACKAGES=$(go list ./... | grep -v /mocks/)
        go test -coverprofile=coverage.out $PACKAGES
        COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | sed 's/%//')
        echo "Total coverage (excluding mocks): ${COVERAGE}%"
        THRESHOLD=20
        if [ "$(echo "$COVERAGE < $THRESHOLD" | bc -l)" -eq 1 ]; then
          echo "::error::Coverage ${COVERAGE}% is below threshold ${THRESHOLD}%"
          exit 1
        fi
    - name: Upload coverage
      if: success() || failure()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: coverage
        path: coverage.out
        if-no-files-found: ignore
    - name: Update coverage badge
      if: github.ref == 'refs/heads/main'
      run: |
        if [ ! -f coverage.out ]; then exit 0; fi
        COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | sed 's/%//')

        # Pick color based on coverage
        if [ "$(echo "$COVERAGE >= 80" | bc -l)" -eq 1 ]; then COLOR="brightgreen"
        elif [ "$(echo "$COVERAGE >= 60" | bc -l)" -eq 1 ]; then COLOR="green"
        elif [ "$(echo "$COVERAGE >= 40" | bc -l)" -eq 1 ]; then COLOR="yellowgreen"
        elif [ "$(echo "$COVERAGE >= 20" | bc -l)" -eq 1 ]; then COLOR="orange"
        else COLOR="red"; fi

        # Write shields.io endpoint JSON
        mkdir -p badges
        cat > badges/coverage.json <<BADGE
        {"schemaVersion":1,"label":"coverage","message":"${COVERAGE}%","color":"${COLOR}"}
        BADGE

        # Push to badges branch
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add -f badges/coverage.json
        git stash
        git fetch origin badges:badges 2>/dev/null || git checkout --orphan badges
        git checkout badges
        git checkout stash -- badges/coverage.json
        git add badges/coverage.json
        git diff --cached --quiet || git commit -m "Update coverage badge: ${COVERAGE}%"
        git push origin badges

  security:
    runs-on: ubuntu-latest
    # Informational: reports vulns but doesn't block merging
    # (Go stdlib vulns can't be fixed until next Go minor release)
    continue-on-error: true
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
    - name: Set up Go
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
      with:
        go-version-file: 'go.mod'
    - name: Install govulncheck
      run: go install golang.org/x/vuln/cmd/govulncheck@latest
    - name: Run govulncheck
      run: govulncheck ./...
