name: deadcode

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  merge_group:

jobs:
  deadcode:
    runs-on: ubuntu-latest
    # Blocking — -test flag includes test executables; allowlist covers pre-existing dead code in loadtest
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
    - name: Set up Go
      uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
      with:
        go-version-file: 'go.mod'
    - name: Install deadcode
      run: go install golang.org/x/tools/cmd/deadcode@latest
    - name: Run deadcode
      run: |
        deadcode -test -filter=github.com/go-risk-it/go-risk-it/internal ./... 2>&1 | \
          grep -v "Pool\.GamesLaunched\|Pool\.LogProgress" | \
          tee /tmp/deadcode-output.txt
        if [ -s /tmp/deadcode-output.txt ]; then
          echo "::warning::Dead code found (see output above)"
          exit 1
        fi
