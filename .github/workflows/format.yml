name: Format

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  merge_group:

permissions:
  contents: read

jobs:
  format:
    name: format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: 'go.mod'

      - name: Install formatters
        run: |
          go install github.com/segmentio/golines@v0.13.0
          go install golang.org/x/tools/cmd/goimports@latest
          go install mvdan.cc/gofumpt@latest

      - name: Run formatters
        run: |
          # Exclude patterns matching pre-commit config:
          #   mocks/**/*.go
          #   internal/data/{copyfrom,data,models,querier,query.sql}.go
          FILES=$(find . -name '*.go' \
            -not -path './mocks/*' \
            -not -path './internal/data/copyfrom.go' \
            -not -path './internal/data/data.go' \
            -not -path './internal/data/models.go' \
            -not -path './internal/data/querier.go' \
            -not -path './internal/data/query.sql.go')

          # Same order as pre-commit hooks
          echo "$FILES" | xargs golines -m 99 -w
          echo "$FILES" | xargs goimports -w
          echo "$FILES" | xargs gofumpt -w

      - name: Check for formatting changes
        run: |
          if ! git diff --exit-code; then
            echo ""
            echo "::error::Formatting check failed. Run 'pre-commit run --all-files' locally and commit the changes."
            exit 1
          fi
