# Custom Prometheus configuration for go-risk-it.
# Extends the LGTM default with recording rules for game summary histograms.
#
# This file is volume-mounted over /otel-lgtm/prometheus.yaml in the LGTM container.
# It preserves all default OTLP/scrape settings and adds rule_files.
---
global:
  scrape_native_histograms: true
otlp:
  keep_identifying_resource_attributes: true
  promote_resource_attributes:
    - service.instance.id
    - service.name
    - service.namespace
    - service.version
    - cloud.availability_zone
    - cloud.region
    - container.name
    - deployment.environment
    - deployment.environment.name
    - k8s.cluster.name
    - k8s.container.name
    - k8s.cronjob.name
    - k8s.daemonset.name
    - k8s.deployment.name
    - k8s.job.name
    - k8s.namespace.name
    - k8s.node.name
    - k8s.pod.name
    - k8s.replicaset.name
    - k8s.statefulset.name
    - host.name
    - postgresql.database.name
    - postgresql.schema.name
    - postgresql.table.name
    - postgresql.index.name
    - database
    - kafka.cluster.alias
storage:
  tsdb:
    out_of_order_time_window: 10m

rule_files:
  - /otel-lgtm/prometheus-rules/*.yml
