receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
        cors:
          allowed_origins:
            - http://*
  prometheus/collector:
    config:
      scrape_configs:
        - job_name: "opentelemetry-collector"
          scrape_interval: 1s
          static_configs:
            - targets: ["127.0.0.1:8888"]
  prometheus/postgres:
    config:
      scrape_configs:
        - job_name: "postgres"
          scrape_interval: 5s
          static_configs:
            - targets: ["postgres-exporter:9187"]

extensions:
  health_check:
    endpoint: 0.0.0.0:13133
    path: "/ready"

processors:
  batch:

exporters:
  otlphttp/metrics:
    endpoint: http://127.0.0.1:9090/api/v1/otlp
    tls:
      insecure: true
  otlphttp/traces:
    endpoint: http://127.0.0.1:4418
    tls:
      insecure: true
  otlphttp/logs:
    endpoint: http://127.0.0.1:3100/otlp
    tls:
      insecure: true
  otlp/profiles:
    endpoint: http://127.0.0.1:4040
    tls:
      insecure: true

connectors:
  spanmetrics:
    histogram:
      explicit:
        buckets: [1ms, 5ms, 10ms, 25ms, 50ms, 100ms, 250ms, 500ms, 1s, 2.5s, 5s, 10s]
    metrics_flush_interval: 5s
    exemplars:
      enabled: true
    dimensions:
      - name: http_route
      - name: http_method
      - name: http_status_code
      - name: error_category
      - name: event_type
      - name: handler
      - name: isolation
      - name: phase
      - name: db_outcome
      - name: ws_fanout
    metrics_expiration: 5m
    aggregation_cardinality_limit: 10000
    # Verification checklist (run with live stack):
    # (a) metric names: traces_spanmetrics_duration_seconds_bucket, traces_spanmetrics_calls_total
    # (b) label format: check whether it's "service" or "service_name"
    # (c) http_route dimension appears as expected label on metrics
    # (d) metrics_expiration cleans up stale series after 5m
    # (e) all 10 dimensions appear as labels on spanmetrics:
    #     curl http://localhost:9090/api/v1/label/__name__/values | grep spanmetrics
    #     curl 'http://localhost:9090/api/v1/series?match[]=traces_spanmetrics_calls_total' | jq '.data[0]'
    #     → verify: http_route, http_method, http_status_code, event_type, handler,
    #              phase, isolation, error_category, db_outcome, ws_fanout
    # (f) dashboard queries resolve: open each dashboard in Grafana, verify panels render data

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/traces, spanmetrics]
    metrics:
      receivers: [otlp, prometheus/collector, prometheus/postgres, spanmetrics]
      processors: [batch]
      exporters: [otlphttp/metrics]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/logs]
    profiles:
      receivers: [otlp]
      exporters: [otlp/profiles]
