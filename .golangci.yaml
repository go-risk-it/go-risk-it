version: "2"
run:
  tests: true
linters:
  default: all
  disable:
    - depguard
    - err113
    - exhaustruct
    - gochecknoglobals
    - iface
    - mnd
    - funcorder
    - noinlineerr
    - wsl
    - wsl_v5
    - paralleltest  # Tests are already 105% parallelized (1045 t.Parallel() calls). Remaining non-parallel tests are deliberate (DB transactions, integration tests). 24.5s test suite doesn't need sub-second optimizations.
  settings:
    unparam:
      check-exported: true
    exhaustive:
      default-signifies-exhaustive: true
    gocritic:
      disabled-checks:
        - singleCaseSwitch
    gosec:
      excludes:
        - G101
        - G404
    iface:
      enable:
        - identical
        - unused
        - opaque
    ireturn:
      allow:
        - error
        - stdlib
        - anon
        - empty
        - generic
        - github\.com/go-risk-it/go-risk-it/internal/kernel/ctx\..*
        - github\.com/go-risk-it/go-risk-it/internal/game/ctx\..*
        - github\.com/go-risk-it/go-risk-it/internal/lobby/ctx\..*
        - github\.com/go-risk-it/go-risk-it/internal/kernel/data.*\.Querier
        - github\.com/go-risk-it/go-risk-it/internal/data/.*/db\.Querier
        - github\.com/jackc/pgx/v5\..*
        - go\.opentelemetry\.io/otel/.*
        - github\.com/go-risk-it/go-risk-it/internal/kernel/bus\..*
        - github\.com/go-risk-it/go-risk-it/internal/game/logic/.*
        - github\.com/go-risk-it/go-risk-it/internal/game/config\..*
        - github\.com/go-risk-it/go-risk-it/internal/game/snapshot\..*
        - github\.com/go-risk-it/go-risk-it/internal/game/headlines\..*
        - github\.com/go-risk-it/go-risk-it/internal/game/data/db\.Querier
        - github\.com/go-risk-it/go-risk-it/internal/lobby/internal/logic/.*
        - github\.com/go-risk-it/go-risk-it/internal/lobby/internal/data/db\.Querier
        - github\.com/go-risk-it/go-risk-it/internal/testonly\..*
        - github\.com/go-risk-it/go-risk-it/internal/game/ws\..*
        - github\.com/go-risk-it/go-risk-it/internal/lobby/ws\..*
        - github\.com/go-risk-it/go-risk-it/internal/web/.*
        - github\.com/go-risk-it/go-risk-it/internal/loadtest/.*
        - github\.com/go-risk-it/go-risk-it/internal/game/rand\.RNG
    lll:
      line-length: 99
      tab-width: 4
    revive:
      rules:
        - name: blank-imports
          disabled: true
    wrapcheck:
      ignore-sigs:
        - ".Errorf("
        - "errors.New("
        - "errors.Join("
        - ".Wrap("
        - ".Wrapf("
      ignore-package-globs:
        - github.com/go-risk-it/go-risk-it/*
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - contextcheck
        path: internal/loadtest/
      - linters:
          - contextcheck
        path: cmd/loadtest/
      - linters:
          - contextcheck
        path: internal/web/middleware/
      - linters:
          - varnamelen
        path: internal/loadtest/
      - linters:
          - varnamelen
        path: cmd/loadtest/
      # Service constructors use constructor-returns-interface pattern for DI
      - linters:
          - ireturn
        path: internal/.*/service\.go$
        text: "returns interface"
      # Module boundary adapters return interfaces for decoupling
      - linters:
          - ireturn
        path: /game\.go$
        text: "returns interface"
      - linters:
          - ireturn
        path: /lobby\.go$
        text: "returns interface"
      # Factory/strategy patterns (dice rollers, mission checkers, region assignment)
      - linters:
          - ireturn
        path: (dice|checker|assignment|rand)/.*\.go$
        text: "returns interface"
      # Data layer DB querier constructors
      - linters:
          - ireturn
        path: internal/.*/data/db/querier\.go$
        text: "returns interface"
      # Move orchestration constructors
      - linters:
          - ireturn
        path: internal/game/internal/logic/move/orchestration/
        text: "returns interface"
      # Board/graph constructors
      - linters:
          - ireturn
        path: internal/game/internal/logic/board/
        text: "returns interface"
      # Snapshot reader (returns polymorphic PhaseState interface)
      - linters:
          - ireturn
        path: internal/.*/snapshot/.*\.go$
        text: "returns interface"
      # Handler constructors return api interfaces
      - linters:
          - ireturn
        path: internal/.*/handlers/.*\.go$
        text: "returns interface"
      - linters:
          - cyclop
          - dogsled
          - dupl
          - funlen
          - gocognit
          - goconst
          - ireturn
          - lll
          - wrapcheck
        path: _test.go
    paths:
      - internal/kernel/upgradablerw_mutex
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gci
    - gofmt
    - gofumpt
    - goimports
  exclusions:
    generated: lax
    paths:
      - internal/kernel/upgradablerw_mutex
      - third_party$
      - builtin$
      - examples$
